
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kewihara_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - kewihara_network
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: kewihara_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kewihara_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kewihara_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kewihara_network
    restart: unless-stopped

networks:
  kewihara_network:
    driver: bridge

volumes:
  redis_data:
